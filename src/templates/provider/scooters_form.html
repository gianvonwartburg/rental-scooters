{% extends "base.html" %} {% block content %} {% if scooter %}
<h1>Scooter bearbeiten</h1>
{% else %}
<h1>Neuer Scooter</h1>
{% endif %}

<form method="post">
  {% if not scooter %}
  <div>
    <label>Scooter-Identifier (eindeutig)</label><br />
    <input name="scooter_identifier" required maxlength="64" />
  </div>
  {% else %}
  <p><strong>Identifier:</strong> {{ scooter.scooter_identifier }}</p>
  {% endif %}

  <div>
    <label>Status</label><br />
    <select name="status" required>
      {% for st in statuses %}
      <option value="{{ st }}"
        {% if (scooter and scooter.status == st) or (not scooter and st == 'available') %}selected{% endif %}>
        {{ st }}
      </option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label>Akku %</label><br />
    <input
      name="battery_percent"
      type="number"
      min="0"
      max="100"
      required
      value="{{ scooter.battery_percent if scooter else 100 }}"
    />
  </div>

  <div>
    <label>Latitude</label><br />
    <input
      name="latitude"
      value="{{ scooter.latitude if scooter and scooter.latitude is not none else '' }}"
    />
  </div>

  <div>
    <label>Longitude</label><br />
    <input
      name="longitude"
      value="{{ scooter.longitude if scooter and scooter.longitude is not none else '' }}"
    />
  </div>

  <button type="submit">Speichern</button>
</form>

<p><a href="{{ url_for('provider.scooters_list') }}">Zurück zur Liste</a></p>

{% endblock %}
